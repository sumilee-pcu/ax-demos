<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown → HTML: 내PC 스튜디오</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/studio.css">
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<style>
  .split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0;min-height:420px;}
  .pane{border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;}
  .pane .ph{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);
    padding:10px 14px;border-bottom:1px solid var(--line-soft);}
  #mdIn{flex:1;background:transparent;border:none;outline:none;resize:none;color:var(--ink);
    font-family:var(--mono);font-size:13px;line-height:1.7;padding:16px;}
  #htmlOut{flex:1;overflow:auto;padding:16px 20px;font-size:14.5px;line-height:1.7;}
  #htmlOut h1,#htmlOut h2,#htmlOut h3{margin:.8em 0 .4em;line-height:1.3;}
  #htmlOut p{margin:.5em 0;}
  #htmlOut pre{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:9px;
    padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;}
  #htmlOut code{font-family:var(--mono);font-size:.92em;background:var(--surface-2);border-radius:5px;padding:1px 5px;}
  #htmlOut pre code{background:none;padding:0;}
  #htmlOut table{border-collapse:collapse;margin:.6em 0;}
  #htmlOut th,#htmlOut td{border:1px solid var(--line);padding:6px 12px;font-size:13.5px;}
  #htmlOut blockquote{border-left:3px solid var(--cyan);margin:.6em 0;padding:2px 14px;color:var(--ink-2);}
  #htmlOut a{color:var(--cyan);}
  @media(max-width:920px){.split{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="studio">
  <aside class="sidebar"></aside>
  <main class="main">

    <div class="crumb" data-i18n="Docs · Docs to the web">문서 · 문서를 웹으로</div>
    <h1 data-i18n="Markdown to HTML">Markdown → HTML</h1>
    <p class="desc" data-i18n="Type or drop markdown on the left and preview the result live. Copy the HTML or download it as a file. Scripts are stripped for safety. Everything stays in your browser.">왼쪽에 마크다운을 쓰거나 파일을 끌어다 놓으면 오른쪽에 결과가 바로 보입니다. HTML 복사 또는 파일로 저장할 수 있고, 스크립트는 안전을 위해 제거됩니다. 모든 처리는 브라우저 안에서만 이루어집니다.</p>

    <div class="toolbar">
      <button class="btn" id="addBtn" data-i18n="Load .md file">.md 불러오기</button>
      <input type="file" id="fileInput" accept=".md,.markdown,text/markdown" hidden>
      <button class="btn" id="sampleBtn" data-i18n="Sample">예시 넣기</button>
      <span style="flex:1"></span>
      <button class="btn" id="copyBody" data-i18n="Copy HTML">HTML 복사</button>
      <button class="btn" id="copyDoc" data-i18n="Copy full document">완전한 문서 복사</button>
      <button class="btn primary" id="dlBtn" data-i18n="Download .html">.html 저장</button>
    </div>

    <div class="split">
      <div class="pane"><div class="ph">MARKDOWN</div><textarea id="mdIn" spellcheck="false" placeholder="# 제목&#10;&#10;여기에 마크다운을 입력하세요."></textarea></div>
      <div class="pane"><div class="ph">PREVIEW</div><div id="htmlOut"></div></div>
    </div>
    <div class="statusline" id="hint"></div>

  </main>
</div>

<script src="assets/i18n.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/stats.js"></script>
<script>
Shell.init({ active: "md-html" });
marked.setOptions({ gfm: true, breaks: false });

const mdIn = document.getElementById("mdIn");
const out = document.getElementById("htmlOut");
let recorded = false;

function setHint(m) { document.getElementById("hint").textContent = m; }

function currentHtml() {
  return DOMPurify.sanitize(marked.parse(mdIn.value || ""));
}

function renderPreview() {
  out.innerHTML = currentHtml();
  if (!recorded && mdIn.value.trim()) { Stats.record({ tool: "md-html", label: "MD→HTML", files: 1 }); recorded = true; }
}
mdIn.oninput = renderPreview;

document.getElementById("addBtn").onclick = () => document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = async (e) => {
  const f = e.target.files[0];
  if (f) { mdIn.value = await f.text(); renderPreview(); }
  e.target.value = "";
};
mdIn.addEventListener("drop", async (e) => {
  const f = [...e.dataTransfer.files].find(f => /\.(md|markdown|txt)$/i.test(f.name));
  if (f) { e.preventDefault(); mdIn.value = await f.text(); renderPreview(); }
});

document.getElementById("sampleBtn").onclick = () => {
  mdIn.value = "# 업무 안내\n\n**내PC 스튜디오**에서 변환했습니다.\n\n## 일정\n\n| 구분 | 날짜 |\n|------|------|\n| 접수 | 7/21 |\n| 마감 | 7/25 |\n\n- [x] 공지 작성\n- [ ] 붙임파일 정리\n\n```python\nprint(\"hello\")\n```\n";
  renderPreview();
};

function fullDoc() {
  return "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>문서</title>\n<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.7;}\ntable{border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px 12px}\npre{background:#f5f5f7;border-radius:8px;padding:12px 14px;overflow-x:auto}\ncode{background:#f0f0f2;border-radius:4px;padding:1px 5px}\nblockquote{border-left:3px solid #888;margin:.6em 0;padding:2px 14px;color:#555}</style>\n</head>\n<body>\n" + currentHtml() + "\n</body>\n</html>\n";
}

async function copyText(t, label) {
  try { await navigator.clipboard.writeText(t); setHint(label + " 복사 완료 (" + t.length + "자)"); }
  catch (e) { setHint("복사 실패: 브라우저 권한을 확인하세요."); }
}
document.getElementById("copyBody").onclick = () => copyText(currentHtml(), "HTML");
document.getElementById("copyDoc").onclick = () => copyText(fullDoc(), "완전한 문서");
document.getElementById("dlBtn").onclick = () => {
  const blob = new Blob([fullDoc()], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "변환문서.html";
  a.click();
  URL.revokeObjectURL(a.href);
  setHint("저장 완료: 변환문서.html");
};
</script>
</body>
</html>
