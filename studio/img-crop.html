<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자르기: 내PC 스튜디오</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/studio.css">
<style>
  .opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .opts .btn.on{border-color:var(--cyan);color:var(--cyan);}
  .stage-wrap{margin:22px 0;border:1px solid var(--line);border-radius:14px;background:var(--surface);
    display:flex;align-items:center;justify-content:center;padding:18px;}
  #stage{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;}
  #stage canvas{display:block;max-width:100%;}
  #box{position:absolute;border:1.5px solid var(--cyan);box-shadow:0 0 0 9999px rgba(0,0,0,.45);cursor:move;}
  .hd{position:absolute;width:12px;height:12px;background:var(--cyan);border-radius:3px;}
  .hd.nw{top:-6px;left:-6px;cursor:nwse-resize;} .hd.n{top:-6px;left:calc(50% - 6px);cursor:ns-resize;}
  .hd.ne{top:-6px;right:-6px;cursor:nesw-resize;} .hd.e{top:calc(50% - 6px);right:-6px;cursor:ew-resize;}
  .hd.se{bottom:-6px;right:-6px;cursor:nwse-resize;} .hd.s{bottom:-6px;left:calc(50% - 6px);cursor:ns-resize;}
  .hd.sw{bottom:-6px;left:-6px;cursor:nesw-resize;} .hd.w{top:calc(50% - 6px);left:-6px;cursor:ew-resize;}
</style>
</head>
<body>
<div class="studio">
  <aside class="sidebar"></aside>
  <main class="main">

    <div class="crumb" data-i18n="Image · Keep only what you need">이미지 · 필요한 부분만</div>
    <h1 data-i18n="Crop">자르기</h1>
    <p class="desc" data-i18n="Drag the box to choose an area, use ratio presets if needed, and save the cropped image at full resolution. Everything stays in your browser.">상자를 드래그해 남길 영역을 정하고, 필요하면 비율 프리셋을 씁니다. 저장은 원본 해상도로 잘라냅니다. 모든 처리는 브라우저 안에서만 이루어집니다.</p>

    <div class="toolbar opts">
      <button class="btn" id="addBtn" data-i18n="Load image">이미지 불러오기</button>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden>
      <button class="btn ratio on" data-ratio="0" data-i18n="Free">자유</button>
      <button class="btn ratio" data-ratio="1">1:1</button>
      <button class="btn ratio" data-ratio="1.3333">4:3</button>
      <button class="btn ratio" data-ratio="1.7778">16:9</button>
      <span style="flex:1"></span>
      <span class="statusline" style="padding:0" id="cropInfo"></span>
      <button class="btn primary" id="runBtn" disabled data-i18n="Save">저장</button>
    </div>

    <div class="dropzone" id="drop" data-i18n="Drop an image here or use the button above">여기로 이미지를 끌어다 놓거나 위의 버튼을 누르세요</div>
    <div class="stage-wrap" id="stageWrap" hidden>
      <div id="stage">
        <canvas id="pv"></canvas>
        <div id="box">
          <div class="hd nw" data-h="nw"></div><div class="hd n" data-h="n"></div><div class="hd ne" data-h="ne"></div>
          <div class="hd e" data-h="e"></div><div class="hd se" data-h="se"></div><div class="hd s" data-h="s"></div>
          <div class="hd sw" data-h="sw"></div><div class="hd w" data-h="w"></div>
        </div>
      </div>
    </div>
    <div class="statusline" id="hint"></div>

  </main>
</div>

<script src="assets/i18n.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/stats.js"></script>
<script src="assets/canvas-utils.js"></script>
<script>
Shell.init({ active: "img-crop" });

let state = null;    // { file, bitmap, scale } scale: 표시 캔버스 / 원본
let box = { x: 0, y: 0, w: 0, h: 0 };   // 표시 좌표계
let ratio = 0;       // 0 = 자유
let drag = null;

const drop = document.getElementById("drop");
const fileInput = document.getElementById("fileInput");
const stage = document.getElementById("stage");
const boxEl = document.getElementById("box");
const pv = document.getElementById("pv");

document.getElementById("addBtn").onclick = () => fileInput.click();
fileInput.onchange = (e) => { if (e.target.files[0]) load(e.target.files[0]); fileInput.value = ""; };
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = [...e.dataTransfer.files].find(CanvasUtils.isImageFile); if (f) load(f); });

function setHint(m) { document.getElementById("hint").textContent = m; }

async function load(file) {
  setHint("불러오는 중...");
  const bitmap = await CanvasUtils.loadBitmap(file);
  const s = Math.min(760 / bitmap.width, 520 / bitmap.height, 1);
  state = { file, bitmap, scale: s };
  pv.width = Math.round(bitmap.width * s);
  pv.height = Math.round(bitmap.height * s);
  pv.getContext("2d").drawImage(bitmap, 0, 0, pv.width, pv.height);
  drop.style.display = "none";
  document.getElementById("stageWrap").hidden = false;
  document.getElementById("runBtn").disabled = false;
  box = { x: pv.width * 0.1, y: pv.height * 0.1, w: pv.width * 0.8, h: pv.height * 0.8 };
  if (ratio) forceRatio();
  paint();
  setHint("");
}

function clampBox() {
  box.w = Math.max(20, Math.min(box.w, pv.width));
  box.h = Math.max(20, Math.min(box.h, pv.height));
  box.x = Math.max(0, Math.min(box.x, pv.width - box.w));
  box.y = Math.max(0, Math.min(box.y, pv.height - box.h));
}

function forceRatio() {
  if (!ratio) return;
  box.h = box.w / ratio;
  clampBox();
  if (box.y + box.h > pv.height) { box.h = pv.height - box.y; box.w = box.h * ratio; }
}

function paint() {
  clampBox();
  boxEl.style.left = box.x + "px";
  boxEl.style.top = box.y + "px";
  boxEl.style.width = box.w + "px";
  boxEl.style.height = box.h + "px";
  const s = state ? state.scale : 1;
  const rw = Math.round(box.w / s), rh = Math.round(box.h / s);
  document.getElementById("cropInfo").textContent = rw + "x" + rh + "px";
}

function ptr(e) {
  const r = stage.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

stage.addEventListener("pointerdown", e => {
  if (!state) return;
  e.preventDefault();
  stage.setPointerCapture(e.pointerId);
  const p = ptr(e);
  const h = e.target.dataset && e.target.dataset.h;
  if (h) drag = { mode: h, start: p, orig: { ...box } };
  else if (e.target === boxEl) drag = { mode: "move", start: p, orig: { ...box } };
  else { box = { x: p.x, y: p.y, w: 1, h: 1 }; drag = { mode: "se", start: p, orig: { ...box } }; }
});
stage.addEventListener("pointermove", e => {
  if (!drag || !state) return;
  const p = ptr(e);
  const dx = p.x - drag.start.x, dy = p.y - drag.start.y;
  const o = drag.orig;
  const m = drag.mode;
  if (m === "move") { box.x = o.x + dx; box.y = o.y + dy; }
  else {
    if (m.includes("e")) box.w = o.w + dx;
    if (m.includes("s")) box.h = o.h + dy;
    if (m.includes("w")) { box.x = o.x + dx; box.w = o.w - dx; }
    if (m.includes("n")) { box.y = o.y + dy; box.h = o.h - dy; }
    if (box.w < 1) box.w = 1;
    if (box.h < 1) box.h = 1;
    if (ratio) {
      if (m === "n" || m === "s") box.w = box.h * ratio;
      else box.h = box.w / ratio;
    }
  }
  paint();
});
["pointerup","pointercancel"].forEach(ev => stage.addEventListener(ev, () => { drag = null; }));

document.querySelectorAll(".ratio").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".ratio").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    ratio = parseFloat(b.dataset.ratio);
    if (state && ratio) { forceRatio(); paint(); }
  };
});

document.getElementById("runBtn").onclick = async () => {
  if (!state) return;
  setHint("만드는 중...");
  try {
    const s = state.scale;
    const sx = Math.round(box.x / s), sy = Math.round(box.y / s);
    const sw = Math.max(1, Math.round(box.w / s)), sh = Math.max(1, Math.round(box.h / s));
    const c = document.createElement("canvas");
    c.width = sw; c.height = sh;
    c.getContext("2d").drawImage(state.bitmap, sx, sy, sw, sh, 0, 0, sw, sh);
    const type = ["image/jpeg","image/png","image/webp"].includes(state.file.type) ? state.file.type : "image/png";
    const { blob } = await CanvasUtils.exportBlob(c, type, type === "image/jpeg" ? 0.92 : undefined);
    CanvasUtils.downloadBlob(blob, CanvasUtils.stripExt(state.file.name) + "_자르기." + CanvasUtils.extFor(blob.type));
    Stats.record({ tool: "img-crop", label: "자르기", files: 1 });
    setHint("저장 완료: " + sw + "x" + sh + "px · " + CanvasUtils.formatBytes(blob.size));
  } catch (err) { setHint("실패: " + err.message); }
};
</script>
</body>
</html>
