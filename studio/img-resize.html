<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이미지 리사이즈: 내PC 스튜디오</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/studio.css">
<style>
  .opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .opts input[type=number]{font-family:var(--mono);font-size:13px;background:var(--surface);border:1px solid var(--line);
    color:var(--ink);border-radius:9px;padding:9px 12px;width:96px;}
  .opts label{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px;}
  .preview{margin:22px 0;border:1px solid var(--line);border-radius:14px;background:var(--surface);
    display:flex;align-items:center;justify-content:center;min-height:280px;padding:18px;}
  .preview canvas{max-width:100%;max-height:480px;}
</style>
</head>
<body>
<div class="studio">
  <aside class="sidebar"></aside>
  <main class="main">

    <div class="crumb" data-i18n="Image · Fit the required size">이미지 · 규격 맞추기</div>
    <h1 data-i18n="Resize">리사이즈</h1>
    <p class="desc" data-i18n="Resize by pixels or percent with the aspect ratio locked. EXIF orientation is applied automatically. Everything stays in your browser.">픽셀 또는 퍼센트로 크기를 조절합니다. 비율은 고정되고 스마트폰 사진의 방향(EXIF)도 자동 반영됩니다. 모든 처리는 브라우저 안에서만 이루어집니다.</p>

    <div class="toolbar opts">
      <button class="btn" id="addBtn" data-i18n="Load image">이미지 불러오기</button>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden>
      <label><span data-i18n="Width">가로</span> <input type="number" id="w" min="1"></label>
      <label><span data-i18n="Height">세로</span> <input type="number" id="h" min="1"></label>
      <label><input type="checkbox" id="lock" checked> <span data-i18n="Lock ratio">비율 고정</span></label>
      <button class="btn" data-pct="25">25%</button>
      <button class="btn" data-pct="50">50%</button>
      <button class="btn" data-pct="75">75%</button>
      <span style="flex:1"></span>
      <button class="btn primary" id="runBtn" disabled data-i18n="Save">저장</button>
    </div>

    <div class="dropzone" id="drop" data-i18n="Drop an image here or use the button above">여기로 이미지를 끌어다 놓거나 위의 버튼을 누르세요</div>
    <div class="preview" id="preview" hidden><canvas id="pv"></canvas></div>
    <div class="statusline" id="hint"></div>

  </main>
</div>

<script src="assets/i18n.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/stats.js"></script>
<script src="assets/canvas-utils.js"></script>
<script>
Shell.init({ active: "img-resize" });

let state = null;   // { file, bitmap, ow, oh }

const drop = document.getElementById("drop");
const fileInput = document.getElementById("fileInput");
const wEl = document.getElementById("w"), hEl = document.getElementById("h");

document.getElementById("addBtn").onclick = () => fileInput.click();
fileInput.onchange = (e) => { if (e.target.files[0]) load(e.target.files[0]); fileInput.value = ""; };
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = [...e.dataTransfer.files].find(CanvasUtils.isImageFile); if (f) load(f); });

function setHint(m) { document.getElementById("hint").textContent = m; }

async function load(file) {
  setHint("불러오는 중...");
  const bitmap = await CanvasUtils.loadBitmap(file);
  state = { file, bitmap, ow: bitmap.width, oh: bitmap.height };
  wEl.value = state.ow; hEl.value = state.oh;
  drop.style.display = "none";
  document.getElementById("preview").hidden = false;
  document.getElementById("runBtn").disabled = false;
  paint();
  setHint("원본 " + state.ow + "x" + state.oh + "px · " + CanvasUtils.formatBytes(file.size));
}

function targetSize() {
  return { w: Math.max(1, parseInt(wEl.value, 10) || state.ow), h: Math.max(1, parseInt(hEl.value, 10) || state.oh) };
}

function paint() {
  if (!state) return;
  const { w, h } = targetSize();
  const pv = document.getElementById("pv");
  const s = Math.min(720 / w, 480 / h, 1);
  pv.width = Math.round(w * s); pv.height = Math.round(h * s);
  const ctx = pv.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(state.bitmap, 0, 0, pv.width, pv.height);
}

wEl.oninput = () => {
  if (state && document.getElementById("lock").checked && wEl.value) {
    hEl.value = Math.max(1, Math.round(parseInt(wEl.value, 10) * state.oh / state.ow));
  }
  paint();
};
hEl.oninput = () => {
  if (state && document.getElementById("lock").checked && hEl.value) {
    wEl.value = Math.max(1, Math.round(parseInt(hEl.value, 10) * state.ow / state.oh));
  }
  paint();
};
document.querySelectorAll("[data-pct]").forEach(b => {
  b.onclick = () => {
    if (!state) return;
    const p = parseInt(b.dataset.pct, 10) / 100;
    wEl.value = Math.max(1, Math.round(state.ow * p));
    hEl.value = Math.max(1, Math.round(state.oh * p));
    paint();
  };
});

document.getElementById("runBtn").onclick = async () => {
  if (!state) return;
  const { w, h } = targetSize();
  setHint("만드는 중...");
  try {
    const canvas = CanvasUtils.toCanvas(state.bitmap, w, h);
    const type = ["image/jpeg","image/png","image/webp"].includes(state.file.type) ? state.file.type : "image/png";
    const { blob, fallback } = await CanvasUtils.exportBlob(canvas, type, type === "image/jpeg" ? 0.92 : undefined);
    const name = CanvasUtils.stripExt(state.file.name) + "_" + w + "px." + CanvasUtils.extFor(blob.type);
    CanvasUtils.downloadBlob(blob, name);
    Stats.record({ tool: "img-resize", label: "리사이즈", files: 1, savedBytes: state.file.size - blob.size });
    setHint("저장 완료: " + w + "x" + h + "px · " + CanvasUtils.formatBytes(blob.size) +
      (fallback ? " · 이 브라우저는 원본 형식을 지원하지 않아 " + CanvasUtils.extFor(blob.type).toUpperCase() + "로 저장했습니다." : ""));
  } catch (err) { setHint("실패: " + err.message); }
};
</script>
</body>
</html>
