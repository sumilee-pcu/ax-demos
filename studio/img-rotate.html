<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회전·뒤집기: 내PC 스튜디오</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/studio.css">
<style>
  .preview{margin:22px 0;border:1px solid var(--line);border-radius:14px;background:var(--surface);
    display:flex;align-items:center;justify-content:center;min-height:280px;padding:18px;}
  .preview canvas{max-width:100%;max-height:480px;}
</style>
</head>
<body>
<div class="studio">
  <aside class="sidebar"></aside>
  <main class="main">

    <div class="crumb" data-i18n="Image · Fix the orientation">이미지 · 방향 바로잡기</div>
    <h1 data-i18n="Rotate &amp; Flip">회전·뒤집기</h1>
    <p class="desc" data-i18n="Rotate in 90-degree steps and flip horizontally or vertically, with a live preview. JPG output is re-encoded. Everything stays in your browser.">90도 단위 회전과 좌우·상하 반전을 실시간 미리보기로 확인합니다. JPG는 저장 시 재인코딩됩니다. 모든 처리는 브라우저 안에서만 이루어집니다.</p>

    <div class="toolbar">
      <button class="btn" id="addBtn" data-i18n="Load image">이미지 불러오기</button>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden>
      <button class="btn" id="rotL" disabled>↺ 90°</button>
      <button class="btn" id="rotR" disabled>↻ 90°</button>
      <button class="btn" id="rot180" disabled>180°</button>
      <button class="btn" id="flipH" disabled data-i18n="Flip H">좌우 반전</button>
      <button class="btn" id="flipV" disabled data-i18n="Flip V">상하 반전</button>
      <button class="btn" id="resetBtn" disabled data-i18n="Reset">되돌리기</button>
      <span style="flex:1"></span>
      <button class="btn primary" id="runBtn" disabled data-i18n="Save">저장</button>
    </div>

    <div class="dropzone" id="drop" data-i18n="Drop an image here or use the button above">여기로 이미지를 끌어다 놓거나 위의 버튼을 누르세요</div>
    <div class="preview" id="preview" hidden><canvas id="pv"></canvas></div>
    <div class="statusline" id="hint"></div>

  </main>
</div>

<script src="assets/i18n.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/stats.js"></script>
<script src="assets/canvas-utils.js"></script>
<script>
Shell.init({ active: "img-rotate" });

let state = null;   // { file, bitmap }
let rot = 0, fH = false, fV = false;

const drop = document.getElementById("drop");
const fileInput = document.getElementById("fileInput");

document.getElementById("addBtn").onclick = () => fileInput.click();
fileInput.onchange = (e) => { if (e.target.files[0]) load(e.target.files[0]); fileInput.value = ""; };
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = [...e.dataTransfer.files].find(CanvasUtils.isImageFile); if (f) load(f); });

function setHint(m) { document.getElementById("hint").textContent = m; }

async function load(file) {
  setHint("불러오는 중...");
  state = { file, bitmap: await CanvasUtils.loadBitmap(file) };
  rot = 0; fH = false; fV = false;
  drop.style.display = "none";
  document.getElementById("preview").hidden = false;
  ["rotL","rotR","rot180","flipH","flipV","resetBtn","runBtn"].forEach(id => document.getElementById(id).disabled = false);
  paint();
}

/* 회전·반전을 적용한 새 캔버스 (scale은 미리보기용 축소) */
function compose(scale) {
  const bmp = state.bitmap;
  const sw = Math.max(1, Math.round(bmp.width * scale)), sh = Math.max(1, Math.round(bmp.height * scale));
  const rotated = rot % 180 !== 0;
  const c = document.createElement("canvas");
  c.width = rotated ? sh : sw;
  c.height = rotated ? sw : sh;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.translate(c.width / 2, c.height / 2);
  ctx.rotate(rot * Math.PI / 180);
  ctx.scale(fH ? -1 : 1, fV ? -1 : 1);
  ctx.drawImage(bmp, -sw / 2, -sh / 2, sw, sh);
  return c;
}

function paint() {
  if (!state) return;
  const bmp = state.bitmap;
  const scale = Math.min(720 / bmp.width, 480 / bmp.height, 1);
  const composed = compose(scale);
  const pv = document.getElementById("pv");
  pv.width = composed.width; pv.height = composed.height;
  pv.getContext("2d").drawImage(composed, 0, 0);
  const full = rot % 180 !== 0 ? [bmp.height, bmp.width] : [bmp.width, bmp.height];
  setHint("결과 " + full[0] + "x" + full[1] + "px · 회전 " + rot + "° · " +
    (fH ? "좌우 반전 " : "") + (fV ? "상하 반전" : ""));
}

document.getElementById("rotL").onclick = () => { rot = (rot + 270) % 360; paint(); };
document.getElementById("rotR").onclick = () => { rot = (rot + 90) % 360; paint(); };
document.getElementById("rot180").onclick = () => { rot = (rot + 180) % 360; paint(); };
document.getElementById("flipH").onclick = () => { fH = !fH; paint(); };
document.getElementById("flipV").onclick = () => { fV = !fV; paint(); };
document.getElementById("resetBtn").onclick = () => { rot = 0; fH = false; fV = false; paint(); };

document.getElementById("runBtn").onclick = async () => {
  if (!state) return;
  setHint("만드는 중...");
  try {
    const canvas = compose(1);
    const type = ["image/jpeg","image/png","image/webp"].includes(state.file.type) ? state.file.type : "image/png";
    const { blob } = await CanvasUtils.exportBlob(canvas, type, type === "image/jpeg" ? 0.92 : undefined);
    CanvasUtils.downloadBlob(blob, CanvasUtils.stripExt(state.file.name) + "_회전." + CanvasUtils.extFor(blob.type));
    Stats.record({ tool: "img-rotate", label: "회전·뒤집기", files: 1 });
    setHint("저장 완료: " + canvas.width + "x" + canvas.height + "px · " + CanvasUtils.formatBytes(blob.size));
  } catch (err) { setHint("실패: " + err.message); }
};
</script>
</body>
</html>
