<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON ⇄ CSV: 내PC 스튜디오</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/studio.css">
<script src="vendor/papaparse.min.js"></script>
<style>
  .opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .opts select{font-family:inherit;font-size:13.5px;background:var(--surface);border:1px solid var(--line);
    color:var(--ink);border-radius:9px;padding:9px 12px;}
  .opts label{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px;}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0;min-height:400px;}
  .pane{border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;}
  .pane .ph{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);
    padding:10px 14px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;}
  .pane textarea{flex:1;background:transparent;border:none;outline:none;resize:none;color:var(--ink);
    font-family:var(--mono);font-size:12.5px;line-height:1.6;padding:14px;}
  @media(max-width:920px){.split{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="studio">
  <aside class="sidebar"></aside>
  <main class="main">

    <div class="crumb" data-i18n="Docs · Reshape your data">문서 · 자료 형식 맞추기</div>
    <h1>JSON ⇄ CSV</h1>
    <p class="desc" data-i18n="Paste or drop JSON or CSV on the left; the direction is detected automatically. Nested objects flatten to dot notation, and Korean text survives Excel via UTF-8 BOM. Everything stays in your browser.">왼쪽에 JSON 또는 CSV를 붙여넣거나 파일을 끌어다 놓으면 방향을 자동 감지해 변환합니다. 중첩 객체는 점 표기로 평탄화되고, 한글은 UTF-8 BOM으로 엑셀에서도 깨지지 않습니다. 모든 처리는 브라우저 안에서만 이루어집니다.</p>

    <div class="toolbar opts">
      <button class="btn" id="addBtn" data-i18n="Load file">파일 불러오기</button>
      <input type="file" id="fileInput" accept=".json,.csv,application/json,text/csv" hidden>
      <select id="dir">
        <option value="auto">방향 자동 감지</option>
        <option value="j2c">JSON → CSV</option>
        <option value="c2j">CSV → JSON</option>
      </select>
      <label><input type="checkbox" id="typed" checked> <span data-i18n="Auto-type numbers/booleans">숫자·불리언 자동 변환</span></label>
      <span style="flex:1"></span>
      <button class="btn" id="copyBtn" data-i18n="Copy result">결과 복사</button>
      <button class="btn primary" id="dlBtn" data-i18n="Download result">결과 저장</button>
    </div>

    <div class="split">
      <div class="pane"><div class="ph"><span data-i18n="INPUT">입력</span><span id="inKind"></span></div>
        <textarea id="src" spellcheck="false" placeholder='[{"이름":"홍길동","부서":"기획"},{"이름":"김철수","부서":"회계"}]'></textarea></div>
      <div class="pane"><div class="ph"><span data-i18n="RESULT">결과</span><span id="outKind"></span></div>
        <textarea id="dst" spellcheck="false" readonly></textarea></div>
    </div>
    <div class="statusline" id="hint"></div>

  </main>
</div>

<script src="assets/i18n.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/stats.js"></script>
<script>
Shell.init({ active: "json-csv" });

const src = document.getElementById("src");
const dst = document.getElementById("dst");
let outMode = null;    // "csv" | "json"
let recorded = false;
let convertTimer = null;

function setHint(m) { document.getElementById("hint").textContent = m; }

/* 중첩 객체 → 점 표기 평탄화. 배열 값은 JSON 문자열로 */
function flatten(obj, prefix, into) {
  into = into || {};
  Object.keys(obj || {}).forEach(function (k) {
    const v = obj[k];
    const key = prefix ? prefix + "." + k : k;
    if (v !== null && typeof v === "object" && !Array.isArray(v)) flatten(v, key, into);
    else if (Array.isArray(v)) into[key] = JSON.stringify(v);
    else into[key] = v;
  });
  return into;
}

function detect(text) {
  const t = text.trim();
  if (!t) return null;
  if (t[0] === "[" || t[0] === "{") return "j2c";
  return "c2j";
}

function convert() {
  const text = src.value;
  const t = text.trim();
  if (!t) { dst.value = ""; document.getElementById("inKind").textContent = ""; document.getElementById("outKind").textContent = ""; return; }
  let dir = document.getElementById("dir").value;
  if (dir === "auto") dir = detect(text);
  try {
    if (dir === "j2c") {
      let data = JSON.parse(t);
      if (!Array.isArray(data)) data = [data];
      const rows = data.map(function (r) { return flatten(typeof r === "object" && r !== null ? r : { value: r }); });
      const cols = [];
      rows.forEach(function (r) { Object.keys(r).forEach(function (k) { if (cols.indexOf(k) === -1) cols.push(k); }); });
      dst.value = Papa.unparse({ fields: cols, data: rows.map(function (r) { return cols.map(function (c) { return r[c] === undefined ? "" : r[c]; }); }) });
      outMode = "csv";
      document.getElementById("inKind").textContent = "JSON";
      document.getElementById("outKind").textContent = "CSV";
      setHint(rows.length + "행 · " + cols.length + "열로 변환했습니다.");
    } else {
      const res = Papa.parse(t, { header: true, skipEmptyLines: true, dynamicTyping: document.getElementById("typed").checked });
      if (res.errors.length) throw new Error(res.errors[0].message + " (행 " + (res.errors[0].row + 1) + ")");
      dst.value = JSON.stringify(res.data, null, 2);
      outMode = "json";
      document.getElementById("inKind").textContent = "CSV";
      document.getElementById("outKind").textContent = "JSON";
      setHint(res.data.length + "행을 JSON 배열로 변환했습니다.");
    }
    if (!recorded) { Stats.record({ tool: "json-csv", label: "JSON⇄CSV", files: 1 }); recorded = true; }
  } catch (err) {
    dst.value = "";
    setHint("변환 실패: " + err.message);
  }
}

src.oninput = function () { clearTimeout(convertTimer); convertTimer = setTimeout(convert, 250); };
document.getElementById("dir").onchange = convert;
document.getElementById("typed").onchange = convert;

document.getElementById("addBtn").onclick = () => document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = async (e) => {
  const f = e.target.files[0];
  if (f) { src.value = await f.text(); convert(); }
  e.target.value = "";
};
src.addEventListener("drop", async (e) => {
  const f = [...e.dataTransfer.files].find(f => /\.(json|csv|txt)$/i.test(f.name));
  if (f) { e.preventDefault(); src.value = await f.text(); convert(); }
});

document.getElementById("copyBtn").onclick = async () => {
  if (!dst.value) return;
  try { await navigator.clipboard.writeText(dst.value); setHint("결과를 복사했습니다."); }
  catch (e) { setHint("복사 실패: 브라우저 권한을 확인하세요."); }
};
document.getElementById("dlBtn").onclick = () => {
  if (!dst.value) return;
  // UTF-8 BOM: 엑셀에서 한글 CSV가 깨지지 않게 한다
  const blob = outMode === "csv"
    ? new Blob(["﻿" + dst.value], { type: "text/csv;charset=utf-8" })
    : new Blob([dst.value], { type: "application/json;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = outMode === "csv" ? "변환.csv" : "변환.json";
  a.click();
  URL.revokeObjectURL(a.href);
  setHint("저장 완료: 변환." + outMode);
};
</script>
</body>
</html>
