<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이미지 압축: 내PC 스튜디오</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/studio.css">
<style>
  .opts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .opts select{font-family:inherit;font-size:13.5px;background:var(--surface);border:1px solid var(--line);
    color:var(--ink);border-radius:9px;padding:9px 12px;}
  .opts input[type=range]{width:180px;accent-color:var(--cyan);}
  .opts .q{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);width:36px;}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0;}
  .cbox{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px;text-align:center;}
  .cbox .t{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:8px;}
  .cbox .v{font-size:22px;font-weight:800;}
  .cbox .v.save{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .preview{margin:0 0 22px;border:1px solid var(--line);border-radius:14px;background:var(--surface);
    display:flex;align-items:center;justify-content:center;min-height:240px;padding:18px;}
  .preview img{max-width:100%;max-height:420px;}
  @media(max-width:920px){.compare{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="studio">
  <aside class="sidebar"></aside>
  <main class="main">

    <div class="crumb" data-i18n="Image · Shrink for submission">이미지 · 제출용 용량 줄이기</div>
    <h1 data-i18n="Compress">압축</h1>
    <p class="desc" data-i18n="Re-encode with a quality slider and see the size before and after. PNG input gets a white background when saved as JPG. Everything stays in your browser.">품질 슬라이더로 재인코딩해 파일 용량을 줄입니다. 압축 전후 용량과 절약률을 바로 보여줍니다. 모든 처리는 브라우저 안에서만 이루어집니다.</p>

    <div class="toolbar opts">
      <button class="btn" id="addBtn" data-i18n="Load image">이미지 불러오기</button>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden>
      <select id="fmt">
        <option value="image/jpeg">JPG로</option>
        <option value="image/webp">WEBP로</option>
      </select>
      <label style="display:flex;align-items:center;gap:8px"><span data-i18n="Quality">품질</span>
        <input type="range" id="q" min="30" max="95" value="70">
        <span class="q" id="qv">0.70</span></label>
      <span style="flex:1"></span>
      <button class="btn primary" id="runBtn" disabled data-i18n="Save">저장</button>
    </div>

    <div class="dropzone" id="drop" data-i18n="Drop an image here or use the button above">여기로 이미지를 끌어다 놓거나 위의 버튼을 누르세요</div>

    <div class="compare" id="compare" hidden>
      <div class="cbox"><div class="t" data-i18n="Before">압축 전</div><div class="v" id="before">-</div></div>
      <div class="cbox"><div class="t" data-i18n="After (estimated)">압축 후 (예상)</div><div class="v save" id="after">-</div></div>
    </div>
    <div class="preview" id="preview" hidden><img id="pv" alt=""></div>
    <div class="statusline" id="hint"></div>

  </main>
</div>

<script src="assets/i18n.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/stats.js"></script>
<script src="assets/canvas-utils.js"></script>
<script>
Shell.init({ active: "img-compress" });

let state = null;      // { file, bitmap, canvas }
let lastBlob = null;
let previewTimer = null;

const drop = document.getElementById("drop");
const fileInput = document.getElementById("fileInput");
const qEl = document.getElementById("q");

document.getElementById("addBtn").onclick = () => fileInput.click();
fileInput.onchange = (e) => { if (e.target.files[0]) load(e.target.files[0]); fileInput.value = ""; };
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = [...e.dataTransfer.files].find(CanvasUtils.isImageFile); if (f) load(f); });

function setHint(m) { document.getElementById("hint").textContent = m; }

async function load(file) {
  setHint("불러오는 중...");
  const bitmap = await CanvasUtils.loadBitmap(file);
  state = { file, bitmap, canvas: CanvasUtils.toCanvas(bitmap) };
  drop.style.display = "none";
  document.getElementById("compare").hidden = false;
  document.getElementById("preview").hidden = false;
  document.getElementById("runBtn").disabled = false;
  document.getElementById("before").textContent = CanvasUtils.formatBytes(file.size);
  setHint("");
  schedulePreview();
}

async function estimate() {
  if (!state) return;
  const fmt = document.getElementById("fmt").value;
  const q = parseInt(qEl.value, 10) / 100;
  const { blob, fallback } = await CanvasUtils.exportBlob(state.canvas, fmt, q);
  lastBlob = blob;
  const pct = state.file.size > 0 ? Math.round((1 - blob.size / state.file.size) * 100) : 0;
  document.getElementById("after").textContent =
    CanvasUtils.formatBytes(blob.size) + (pct > 0 ? " (-" + pct + "%)" : "");
  const img = document.getElementById("pv");
  if (img.dataset.url) URL.revokeObjectURL(img.dataset.url);
  img.src = img.dataset.url = URL.createObjectURL(blob);
  if (fallback) setHint("이 브라우저는 " + CanvasUtils.extFor(fmt).toUpperCase() + " 저장을 지원하지 않아 " +
    CanvasUtils.extFor(blob.type).toUpperCase() + "로 대체합니다. JPG를 권장합니다.");
}

function schedulePreview() {
  document.getElementById("qv").textContent = (parseInt(qEl.value, 10) / 100).toFixed(2);
  clearTimeout(previewTimer);
  previewTimer = setTimeout(estimate, 250);
}
qEl.oninput = schedulePreview;
document.getElementById("fmt").onchange = schedulePreview;

document.getElementById("runBtn").onclick = async () => {
  if (!state || !lastBlob) return;
  const blob = lastBlob;
  CanvasUtils.downloadBlob(blob, CanvasUtils.stripExt(state.file.name) + "_압축." + CanvasUtils.extFor(blob.type));
  Stats.record({ tool: "img-compress", label: "압축", files: 1, savedBytes: state.file.size - blob.size });
  setHint("저장 완료: " + CanvasUtils.formatBytes(state.file.size) + " → " + CanvasUtils.formatBytes(blob.size));
};
</script>
</body>
</html>
