<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>형식 변환: 내PC 스튜디오</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/studio.css">
<script src="vendor/jszip.min.js"></script>
<style>
  .opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .opts select{font-family:inherit;font-size:13.5px;background:var(--surface);border:1px solid var(--line);
    color:var(--ink);border-radius:9px;padding:9px 12px;}
  .filelist{margin:22px 0;display:flex;flex-direction:column;gap:8px;}
  .frow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;
    background:var(--surface);padding:11px 16px;font-size:13.5px;}
  .frow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .frow .sz,.frow .st{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .frow .st.done{color:var(--cyan);}
</style>
</head>
<body>
<div class="studio">
  <aside class="sidebar"></aside>
  <main class="main">

    <div class="crumb" data-i18n="Image · JPG, PNG, WEBP">이미지 · JPG·PNG·WEBP</div>
    <h1 data-i18n="Convert format">형식 변환</h1>
    <p class="desc" data-i18n="Convert images between JPG, PNG and WEBP, one file or a whole batch. Everything stays in your browser.">JPG·PNG·WEBP 형식을 상호 변환합니다. 한 장이면 바로, 여러 장이면 zip으로 내려받습니다. 모든 처리는 브라우저 안에서만 이루어집니다.</p>

    <div class="toolbar opts">
      <button class="btn" id="addBtn" data-i18n="Load images">이미지 불러오기</button>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple hidden>
      <select id="fmt">
        <option value="image/jpeg">JPG로</option>
        <option value="image/png">PNG로</option>
        <option value="image/webp">WEBP로</option>
      </select>
      <button class="btn" id="clearBtn" disabled data-i18n="Clear all">전체 비우기</button>
      <span style="flex:1"></span>
      <span class="statusline" style="padding:0"><span data-i18n="files">파일</span> <span class="count" id="fileCount">0</span></span>
      <button class="btn primary" id="runBtn" disabled data-i18n="Convert &amp; save">변환 저장</button>
    </div>

    <div class="dropzone" id="drop" data-i18n="Drop images here or use the button above">여기로 이미지 파일들을 끌어다 놓거나 위의 버튼을 누르세요</div>
    <div class="filelist" id="list"></div>
    <div class="statusline" id="hint"></div>

  </main>
</div>

<script src="assets/i18n.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/stats.js"></script>
<script src="assets/canvas-utils.js"></script>
<script>
Shell.init({ active: "img-convert" });

let items = [];   // { file, status }

const drop = document.getElementById("drop");
const fileInput = document.getElementById("fileInput");
const list = document.getElementById("list");

document.getElementById("addBtn").onclick = () => fileInput.click();
fileInput.onchange = (e) => { addFiles(e.target.files); fileInput.value = ""; };
document.getElementById("clearBtn").onclick = () => { items = []; render(); };
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));

function setHint(m) { document.getElementById("hint").textContent = m; }

function addFiles(fs) {
  const files = [...fs].filter(CanvasUtils.isImageFile);
  if (!files.length) { setHint("JPG·PNG·WEBP 파일만 지원합니다."); return; }
  files.forEach(f => items.push({ file: f, status: "" }));
  render();
}

function render() {
  const has = items.length > 0;
  drop.style.display = has ? "none" : "block";
  document.getElementById("fileCount").textContent = items.length;
  document.getElementById("runBtn").disabled = !has;
  document.getElementById("clearBtn").disabled = !has;
  list.innerHTML = "";
  items.forEach(it => {
    const row = document.createElement("div");
    row.className = "frow";
    row.innerHTML = '<span class="nm">' + it.file.name + '</span><span class="sz">' +
      CanvasUtils.formatBytes(it.file.size) + '</span><span class="st' + (it.status === "완료" ? " done" : "") + '">' + it.status + "</span>";
    list.appendChild(row);
  });
}

document.getElementById("runBtn").onclick = async () => {
  if (!items.length) return;
  const fmt = document.getElementById("fmt").value;
  const ext = CanvasUtils.extFor(fmt);
  let fallbackSeen = false;
  setHint("변환 중...");
  try {
    const results = [];
    for (const it of items) {
      it.status = "변환 중"; render();
      const bmp = await CanvasUtils.loadBitmap(it.file);
      const { blob, fallback } = await CanvasUtils.exportBlob(CanvasUtils.toCanvas(bmp), fmt, fmt === "image/png" ? undefined : 0.92);
      if (fallback) fallbackSeen = true;
      results.push({ name: CanvasUtils.stripExt(it.file.name) + "." + CanvasUtils.extFor(blob.type), blob });
      it.status = "완료"; render();
    }
    if (results.length === 1) {
      CanvasUtils.downloadBlob(results[0].blob, results[0].name);
    } else {
      const zip = new JSZip();
      results.forEach(r => zip.file(r.name, r.blob));
      CanvasUtils.downloadBlob(await zip.generateAsync({ type: "blob" }), "변환_" + ext + ".zip");
    }
    Stats.record({ tool: "img-convert", label: "형식 변환", files: results.length });
    setHint("저장 완료: " + results.length + "장 변환" +
      (fallbackSeen ? " · 이 브라우저는 " + ext.toUpperCase() + " 저장을 지원하지 않아 일부를 다른 형식으로 저장했습니다. JPG/PNG를 권장합니다." : ""));
  } catch (err) { setHint("실패: " + err.message); }
};
</script>
</body>
</html>
