<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF → 이미지: 내PC 스튜디오</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/studio.css">
<script src="vendor/pdf.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<style>
  .opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .opts select,.opts input[type=text]{font-family:inherit;font-size:13.5px;background:var(--surface);
    border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 12px;}
  .opts input[type=text]{font-family:var(--mono);width:160px;}
</style>
</head>
<body>
<div class="studio">
  <aside class="sidebar"></aside>
  <main class="main">

    <div class="crumb" data-i18n="PDF · Pages as pictures">PDF · 공문을 그림파일로</div>
    <h1 data-i18n="PDF to Images">PDF → 이미지</h1>
    <p class="desc" data-i18n="Render each PDF page as a PNG or JPG. One page downloads directly; multiple pages are bundled as a zip. Everything stays in your browser.">PDF의 각 페이지를 PNG 또는 JPG로 저장합니다. 한 페이지면 바로, 여러 페이지면 zip으로 내려받습니다. 모든 처리는 브라우저 안에서만 이루어집니다.</p>

    <div class="toolbar opts">
      <button class="btn" id="addBtn" data-i18n="Load PDF">PDF 불러오기</button>
      <input type="file" id="fileInput" accept="application/pdf" hidden>
      <select id="fmt">
        <option value="image/png">PNG</option>
        <option value="image/jpeg">JPG</option>
      </select>
      <select id="scale">
        <option value="1">1x (72dpi)</option>
        <option value="2" selected>2x (144dpi)</option>
        <option value="3">3x (216dpi)</option>
      </select>
      <input type="text" id="range" placeholder="범위 예: 1-3,7 (비우면 전체)">
      <span style="flex:1"></span>
      <span class="statusline" style="padding:0"><span data-i18n="pages">페이지</span> <span class="count" id="pageCount">0</span></span>
      <button class="btn primary" id="runBtn" disabled data-i18n="Save images">이미지 저장</button>
    </div>

    <div class="dropzone" id="drop" data-i18n="Drop a PDF here or use the button above">여기로 PDF 파일을 끌어다 놓거나 위의 버튼을 누르세요</div>
    <div class="thumb-grid" id="grid"></div>
    <div class="statusline" id="hint"></div>

  </main>
</div>

<script src="assets/i18n.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/stats.js"></script>
<script src="assets/pdf-utils.js"></script>
<script>
Shell.init({ active: "pdf-to-image" });
pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js";

let src = null;

const grid = document.getElementById("grid");
const drop = document.getElementById("drop");
const fileInput = document.getElementById("fileInput");

document.getElementById("addBtn").onclick = () => fileInput.click();
fileInput.onchange = (e) => { if (e.target.files[0]) loadFile(e.target.files[0]); fileInput.value = ""; };
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = [...e.dataTransfer.files].find(f => /\.pdf$/i.test(f.name)); if (f) loadFile(f); });

function setHint(m) { document.getElementById("hint").textContent = m; }

async function loadFile(file) {
  if (file.size > 100 * 1024 * 1024) setHint("100MB가 넘는 파일은 브라우저 메모리 한계로 실패할 수 있습니다.");
  else setHint("불러오는 중...");
  src = await PdfUtils.loadDoc(file);
  drop.style.display = "none";
  document.getElementById("pageCount").textContent = src.pageCount;
  document.getElementById("runBtn").disabled = false;
  grid.innerHTML = "";
  for (let p = 1; p <= src.pageCount; p++) {
    const card = document.createElement("div");
    card.className = "page";
    card.innerHTML = '<div class="thumb" style="min-height:170px"></div><div class="meta" style="padding-bottom:9px">' + p + "</div>";
    grid.appendChild(card);
    PdfUtils.renderPage(src.doc, p, { targetWidth: 150 }).then(c => {
      const t = card.querySelector(".thumb"); t.innerHTML = ""; t.appendChild(c);
    }).catch(() => { card.querySelector(".thumb").textContent = "미리보기 실패"; });
  }
  setHint("");
}

function canvasToBlob(canvas, type) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(b => b ? resolve(b) : reject(new Error("이미지 생성 실패")), type, type === "image/jpeg" ? 0.92 : undefined);
  });
}

document.getElementById("runBtn").onclick = async () => {
  if (!src) return;
  const fmt = document.getElementById("fmt").value;
  const ext = fmt === "image/png" ? "png" : "jpg";
  const scale = parseInt(document.getElementById("scale").value, 10);
  const rangeText = document.getElementById("range").value.trim();
  const pages = rangeText ? PdfUtils.parseRange(rangeText, src.pageCount)
                          : Array.from({ length: src.pageCount }, (_, i) => i + 1);
  if (!pages.length) { setHint("범위에 해당하는 페이지가 없습니다."); return; }
  const base = PdfUtils.baseName(src.name);
  setHint("변환 중... (0/" + pages.length + ")");
  try {
    if (pages.length === 1) {
      const canvas = await PdfUtils.renderPage(src.doc, pages[0], { scale });
      const blob = await canvasToBlob(canvas, fmt);
      PdfUtils.downloadBlob(blob, base + "_p" + PdfUtils.pad3(pages[0]) + "." + ext);
      Stats.record({ tool: "pdf-to-image", label: "PDF→이미지", files: 1 });
      setHint("저장 완료: " + canvas.width + "x" + canvas.height + "px");
    } else {
      const zip = new JSZip();
      let done = 0;
      for (const p of pages) {
        const canvas = await PdfUtils.renderPage(src.doc, p, { scale });
        zip.file(base + "_p" + PdfUtils.pad3(p) + "." + ext, await canvasToBlob(canvas, fmt));
        setHint("변환 중... (" + (++done) + "/" + pages.length + ")");
      }
      const blob = await zip.generateAsync({ type: "blob" });
      PdfUtils.downloadBlob(blob, base + "_이미지.zip");
      Stats.record({ tool: "pdf-to-image", label: "PDF→이미지", files: pages.length });
      setHint("저장 완료: 이미지 " + pages.length + "장을 zip으로 묶었습니다.");
    }
  } catch (err) {
    setHint("실패: " + err.message);
  }
};
</script>
</body>
</html>
