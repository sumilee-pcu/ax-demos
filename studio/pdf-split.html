<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 분할·추출: 내PC 스튜디오</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/studio.css">
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<style>
  .page.sel{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan) inset;}
  .page .thumb{cursor:pointer;min-height:170px;}
  .opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .opts input[type=text],.opts input[type=number]{font-family:var(--mono);font-size:13px;background:var(--surface);
    border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 12px;width:180px;}
  .opts input[type=number]{width:80px;}
  .opts select{font-family:inherit;font-size:13.5px;background:var(--surface);border:1px solid var(--line);
    color:var(--ink);border-radius:9px;padding:9px 12px;}
</style>
</head>
<body>
<div class="studio">
  <aside class="sidebar"></aside>
  <main class="main">

    <div class="crumb" data-i18n="PDF · Pick only the pages you need">PDF · 필요한 쪽만 골라서</div>
    <h1 data-i18n="Split PDF">PDF 분할·추출</h1>
    <p class="desc" data-i18n="Click thumbnails or type a range to extract pages into a new PDF, or split the file apart. Everything stays in your browser.">썸네일을 클릭하거나 범위를 입력해 필요한 페이지만 새 PDF로 추출하고, 파일을 여러 개로 나눕니다. 모든 처리는 브라우저 안에서만 이루어집니다.</p>

    <div class="toolbar opts">
      <button class="btn" id="addBtn" data-i18n="Load PDF">PDF 불러오기</button>
      <input type="file" id="fileInput" accept="application/pdf" hidden>
      <select id="mode">
        <option value="extract">선택 페이지만 추출</option>
        <option value="chunk">N페이지 단위 분할 (zip)</option>
        <option value="each">전 페이지 개별 PDF (zip)</option>
      </select>
      <input type="text" id="range" placeholder="예: 1-3,7,10-끝">
      <input type="number" id="chunkN" min="1" value="5" hidden>
      <span style="flex:1"></span>
      <span class="statusline" style="padding:0"><span data-i18n="selected">선택</span> <span class="count" id="selCount">0</span> / <span class="count" id="pageCount">0</span></span>
      <button class="btn primary" id="runBtn" disabled data-i18n="Save result">결과 저장</button>
    </div>

    <div class="dropzone" id="drop" data-i18n="Drop a PDF here or use the button above">여기로 PDF 파일을 끌어다 놓거나 위의 버튼을 누르세요</div>
    <div class="thumb-grid" id="grid"></div>
    <div class="statusline" id="hint"></div>

  </main>
</div>

<script src="assets/i18n.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/stats.js"></script>
<script src="assets/pdf-utils.js"></script>
<script>
Shell.init({ active: "pdf-split" });
pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js";

let src = null;                 // { doc, bytes, name, pageCount }
let selected = new Set();       // 1-based

const grid = document.getElementById("grid");
const drop = document.getElementById("drop");
const fileInput = document.getElementById("fileInput");
const rangeEl = document.getElementById("range");
const modeEl = document.getElementById("mode");
const chunkEl = document.getElementById("chunkN");

document.getElementById("addBtn").onclick = () => fileInput.click();
fileInput.onchange = (e) => { if (e.target.files[0]) loadFile(e.target.files[0]); fileInput.value = ""; };
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = [...e.dataTransfer.files].find(f => /\.pdf$/i.test(f.name)); if (f) loadFile(f); });

modeEl.onchange = () => {
  chunkEl.hidden = modeEl.value !== "chunk";
  rangeEl.hidden = modeEl.value !== "extract";
  syncUI();
};
rangeEl.oninput = () => {
  if (!src) return;
  selected = new Set(PdfUtils.parseRange(rangeEl.value, src.pageCount));
  paintSelection();
};

function setHint(m) { document.getElementById("hint").textContent = m; }

async function loadFile(file) {
  if (file.size > 100 * 1024 * 1024) setHint("100MB가 넘는 파일은 브라우저 메모리 한계로 실패할 수 있습니다.");
  else setHint("불러오는 중...");
  src = await PdfUtils.loadDoc(file);
  selected = new Set();
  drop.style.display = "none";
  document.getElementById("pageCount").textContent = src.pageCount;
  grid.innerHTML = "";
  for (let p = 1; p <= src.pageCount; p++) {
    const card = document.createElement("div");
    card.className = "page";
    card.dataset.page = p;
    card.innerHTML = '<div class="thumb"></div><div class="meta" style="padding-bottom:9px">' + p + "</div>";
    card.querySelector(".thumb").onclick = () => togglePage(p);
    grid.appendChild(card);
    PdfUtils.renderPage(src.doc, p, { targetWidth: 150 }).then(c => {
      const t = card.querySelector(".thumb"); t.innerHTML = ""; t.appendChild(c);
    }).catch(() => { card.querySelector(".thumb").textContent = "미리보기 실패"; });
  }
  setHint("");
  syncUI();
}

function togglePage(p) {
  if (selected.has(p)) selected.delete(p); else selected.add(p);
  rangeEl.value = [...selected].sort((a, b) => a - b).join(",");
  paintSelection();
}

function paintSelection() {
  [...grid.children].forEach(card => {
    card.classList.toggle("sel", selected.has(parseInt(card.dataset.page, 10)));
  });
  document.getElementById("selCount").textContent = selected.size;
  syncUI();
}

function syncUI() {
  const mode = modeEl.value;
  const ok = src && (mode !== "extract" || selected.size > 0);
  document.getElementById("runBtn").disabled = !ok;
  document.getElementById("selCount").textContent = selected.size;
}

async function buildSubset(pageNos) {
  const { PDFDocument } = PDFLib;
  const inDoc = await PDFDocument.load(src.bytes);
  const out = await PDFDocument.create();
  const copied = await out.copyPages(inDoc, pageNos.map(n => n - 1));
  copied.forEach(p => out.addPage(p));
  return out.save();
}

document.getElementById("runBtn").onclick = async () => {
  if (!src) return;
  const mode = modeEl.value;
  const base = PdfUtils.baseName(src.name);
  setHint("만드는 중...");
  try {
    if (mode === "extract") {
      const pagesSel = [...selected].sort((a, b) => a - b);
      const bytes = await buildSubset(pagesSel);
      PdfUtils.downloadBytes(bytes, base + "_추출.pdf");
      Stats.record({ tool: "pdf-split", label: "PDF 추출", files: 1 });
      setHint("저장 완료: " + pagesSel.length + "페이지를 추출했습니다.");
    } else {
      const zip = new JSZip();
      let count = 0;
      if (mode === "chunk") {
        const n = Math.max(1, parseInt(chunkEl.value, 10) || 1);
        for (let start = 1; start <= src.pageCount; start += n) {
          const nos = [];
          for (let p = start; p < start + n && p <= src.pageCount; p++) nos.push(p);
          zip.file(base + "_p" + PdfUtils.pad3(start) + ".pdf", await buildSubset(nos));
          count++;
        }
      } else {
        for (let p = 1; p <= src.pageCount; p++) {
          zip.file(base + "_p" + PdfUtils.pad3(p) + ".pdf", await buildSubset([p]));
          count++;
        }
      }
      const blob = await zip.generateAsync({ type: "blob" });
      PdfUtils.downloadBlob(blob, base + "_분할.zip");
      Stats.record({ tool: "pdf-split", label: "PDF 분할", files: count });
      setHint("저장 완료: PDF " + count + "개를 zip으로 묶었습니다.");
    }
  } catch (err) {
    setHint("실패: " + err.message);
  }
};
</script>
</body>
</html>
