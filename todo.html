<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>투두리스트 · Vibe Build</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0b0f;--surface:#13151c;--surface-2:#171a22;--line:rgba(255,255,255,.09);--line-soft:rgba(255,255,255,.055);
        --ink:#f5f6f8;--ink-2:#c2c7d0;--muted:#7c828f;--cyan:#3ee7d1;--violet:#9a8bff;
        --grad:linear-gradient(100deg,#3ee7d1 0%,#7c8cff 52%,#b08cff 100%);--mono:"JetBrains Mono",ui-monospace,monospace;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--ink);
       line-height:1.6;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;position:relative;}
  body::before{content:"";position:fixed;top:-220px;left:-140px;width:620px;height:620px;pointer-events:none;
    background:radial-gradient(circle,rgba(62,231,209,.12),rgba(124,140,255,.08) 40%,transparent 66%);z-index:0;}
  .bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.3px);background-size:26px 26px;
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.8),transparent 58%);
    mask-image:linear-gradient(180deg,rgba(0,0,0,.8),transparent 58%);}
  .wrap{max-width:600px;margin:0 auto;padding:56px 28px 80px;position:relative;z-index:1;}
  a.back{font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none;}
  a.back:hover{color:var(--ink);}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--cyan);margin:26px 0 14px;
           display:flex;align-items:center;gap:8px;}
  .eyebrow::before{content:"";width:18px;height:1px;background:var(--cyan);opacity:.7;}
  h1{font-size:30px;letter-spacing:-.03em;font-weight:800;}
  .sub{margin-top:10px;color:var(--ink-2);font-size:15px;}
  .inputrow{display:flex;gap:8px;margin:30px 0 8px;}
  input,select{font-family:inherit;font-size:14px;padding:12px 13px;border:1px solid var(--line);border-radius:10px;
               color:var(--ink);background:var(--surface);}
  #title{flex:1;}
  input::placeholder{color:var(--muted);}
  input:focus,select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(62,231,209,.16);}
  .btn{font-family:inherit;border:none;background:var(--grad);color:#0a0b0f;padding:12px 18px;border-radius:10px;
       font-size:14px;font-weight:700;cursor:pointer;letter-spacing:-.01em;}
  .btn:hover{filter:brightness(1.08);}
  .counts{display:flex;justify-content:space-between;align-items:center;margin:16px 2px;font-size:13px;color:var(--muted);}
  .counts b{color:var(--ink);font-weight:600;}
  .clear{background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:12px;cursor:pointer;}
  .clear:hover{color:var(--ink);}
  ul{list-style:none;}
  li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:9px;
     display:flex;align-items:center;gap:13px;transition:border-color .15s;}
  li:hover{border-color:rgba(124,140,255,.4);}
  li.done .t{text-decoration:line-through;color:var(--muted);}
  li input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:#7c8cff;}
  li .t{flex:1;font-size:15px;letter-spacing:-.01em;}
  .pri{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid transparent;}
  .pri.high{background:rgba(255,107,107,.14);color:#ff9d9d;}
  .pri.mid{background:rgba(124,140,255,.16);color:#aeb6ff;}
  .pri.low{background:var(--surface-2);color:var(--muted);border-color:var(--line-soft);}
  .del{background:none;border:none;color:#565b66;font-size:16px;cursor:pointer;line-height:1;}
  .del:hover{color:#ff6b6b;}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}
</style>
</head>
<body>
<div class="bgfx"></div>
<div class="wrap">
  <a class="back" href="index.html">← 미션 목록</a>
  <div class="eyebrow">$ build todo-list</div>
  <h1>투두리스트</h1>
  <p class="sub">할 일을 추가하고 체크하세요. 새로고침해도 남아 있습니다.</p>

  <div class="inputrow">
    <input id="title" type="text" placeholder="할 일을 입력하세요" autocomplete="off">
    <select id="priority">
      <option value="high">높음</option>
      <option value="mid" selected>보통</option>
      <option value="low">낮음</option>
    </select>
    <button class="btn" id="add">추가</button>
  </div>

  <div class="counts">
    <span>남은 일 <b id="remain">0</b>개 · 완료 <b id="done">0</b>개</span>
    <button class="clear" id="clearDone">완료 항목 비우기</button>
  </div>

  <ul id="list"></ul>
  <div class="empty" id="empty">아직 할 일이 없습니다. 위에서 추가해 보세요.</div>
</div>

<script>
const KEY = "workshop_todos";
const DEMO = new URLSearchParams(location.search).has("demo");
const SAMPLE = [
  { id:1, title:"워크숍 자료 최종 점검", priority:"high", done:false },
  { id:2, title:"실습용 PDF 두 개 준비", priority:"mid", done:false },
  { id:3, title:"노션 미션 페이지 링크 공유", priority:"mid", done:true },
  { id:4, title:"점심 식당 예약", priority:"low", done:false },
];
let todos = DEMO ? SAMPLE.slice() : JSON.parse(localStorage.getItem(KEY) || "[]");
let seq = todos.reduce((m,t)=>Math.max(m,t.id),0);
const priLabel = { high:["높음","high"], mid:["보통","mid"], low:["낮음","low"] };

const $ = (id) => document.getElementById(id);
function save(){ if(DEMO) return; localStorage.setItem(KEY, JSON.stringify(todos)); }

function add(){
  const title = $("title").value.trim();
  if(!title) return;
  todos.push({ id:++seq, title, priority:$("priority").value, done:false });
  $("title").value = "";
  save(); render();
}
$("add").onclick = add;
$("title").addEventListener("keydown", e => { if(e.key==="Enter") add(); });
$("clearDone").onclick = () => { todos = todos.filter(t=>!t.done); save(); render(); };

function render(){
  const list = $("list");
  list.innerHTML = "";
  $("empty").style.display = todos.length ? "none" : "block";
  todos.forEach(t => {
    const li = document.createElement("li");
    if(t.done) li.className = "done";
    const [label, cls] = priLabel[t.priority] || priLabel.mid;
    li.innerHTML = `
      <input type="checkbox" ${t.done?"checked":""}>
      <span class="t"></span>
      <span class="pri ${cls}">${label}</span>
      <button class="del" title="삭제">✕</button>`;
    li.querySelector(".t").textContent = t.title;
    li.querySelector("input").onchange = () => { t.done = !t.done; save(); render(); };
    li.querySelector(".del").onclick = () => { todos = todos.filter(x=>x.id!==t.id); save(); render(); };
    list.appendChild(li);
  });
  $("remain").textContent = todos.filter(t=>!t.done).length;
  $("done").textContent = todos.filter(t=>t.done).length;
}
render();
</script>
</body>
</html>
