<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 에디터 (바이브코딩 데모)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap');
  :root{--bg:#0a0b0f;--surface:#13151c;--surface-2:#171a22;--line:rgba(255,255,255,.09);--line-soft:rgba(255,255,255,.055);
        --ink:#f5f6f8;--ink-2:#c2c7d0;--muted:#7c828f;--cyan:#3ee7d1;--violet:#9a8bff;
        --grad:linear-gradient(100deg,#3ee7d1 0%,#7c8cff 52%,#b08cff 100%);--mono:"JetBrains Mono",ui-monospace,monospace;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--ink);
       letter-spacing:-.011em;-webkit-font-smoothing:antialiased;position:relative;}
  body::before{content:"";position:fixed;top:-220px;left:-140px;width:680px;height:680px;pointer-events:none;
    background:radial-gradient(circle,rgba(62,231,209,.12),rgba(124,140,255,.08) 40%,transparent 66%);z-index:0;}
  .bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.3px);background-size:26px 26px;
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.8),transparent 52%);
    mask-image:linear-gradient(180deg,rgba(0,0,0,.8),transparent 52%);}
  header{padding:34px 40px 22px;max-width:1180px;margin:0 auto;position:relative;z-index:1;}
  header .back{font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none;}
  header .back:hover{color:var(--ink);}
  header .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--cyan);margin:20px 0 12px;
                 display:flex;align-items:center;gap:8px;}
  header .eyebrow::before{content:"";width:18px;height:1px;background:var(--cyan);opacity:.7;}
  header h1{margin:0;font-size:30px;letter-spacing:-.03em;font-weight:800;}
  header p{margin:10px 0 0;color:var(--ink-2);font-size:14.5px;max-width:70ch;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px 40px;max-width:1180px;margin:0 auto;
           border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line);position:sticky;top:0;
           background:rgba(10,11,15,.78);backdrop-filter:blur(10px);z-index:5;}
  .btn{font-family:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;
       border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;}
  .btn:hover{border-color:var(--cyan);color:var(--cyan);}
  .btn.primary{background:var(--grad);color:#0a0b0f;border-color:transparent;font-weight:700;}
  .btn.primary:hover{filter:brightness(1.08);color:#0a0b0f;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  #drop{max-width:1180px;margin:28px auto;padding:64px;border:1.5px dashed var(--line);border-radius:16px;
        text-align:center;color:var(--muted);background:var(--surface);font-size:14.5px;position:relative;z-index:1;}
  #drop.over{border-color:var(--cyan);color:var(--cyan);background:var(--surface-2);}
  #grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px;
        padding:24px 40px;position:relative;z-index:1;}
  .page{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;
        background:var(--surface);transition:border-color .15s,box-shadow .15s;}
  .page:hover{border-color:rgba(124,140,255,.45);box-shadow:0 16px 40px -24px rgba(124,140,255,.5);}
  .page .thumb{background:var(--surface-2);display:flex;align-items:center;justify-content:center;min-height:210px;}
  .page canvas{max-width:100%;height:auto;display:block;}
  .page .meta{font-family:var(--mono);font-size:11px;color:var(--muted);padding:8px 8px 0;text-align:center;}
  .page .actions{display:flex;justify-content:center;gap:5px;padding:9px;flex-wrap:wrap;}
  .iconbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;width:31px;height:31px;cursor:pointer;
           font-size:13px;color:var(--ink-2);}
  .iconbtn:hover{border-color:var(--cyan);color:var(--cyan);}
  .iconbtn.del:hover{border-color:#ff6b6b;color:#ff6b6b;}
  .status{padding:0 40px 28px;max-width:1180px;margin:0 auto;color:var(--muted);font-size:13px;font-family:var(--mono);position:relative;z-index:1;}
  .count{font-weight:600;color:var(--ink);font-family:var(--mono);}
</style>
</head>
<body>
<div class="bgfx"></div>
<header>
  <a class="back" href="index.html">← 미션 목록</a>
  <div class="eyebrow">$ build pdf-editor</div>
  <h1>PDF 에디터</h1>
  <p>여러 PDF를 불러와 페이지를 삭제하고 회전하고 순서를 바꾼 뒤 하나로 합쳐 내려받습니다. 모든 처리는 브라우저 안에서만 이루어지며 서버로 전송되지 않습니다.</p>
</header>

<div class="toolbar">
  <button class="btn" id="addBtn">PDF 불러오기</button>
  <input type="file" id="fileInput" accept="application/pdf" multiple hidden>
  <button class="btn" id="clearBtn" disabled>전체 비우기</button>
  <span style="flex:1"></span>
  <span class="status" style="padding:0">페이지 <span class="count" id="pageCount">0</span>개</span>
  <button class="btn primary" id="saveBtn" disabled>PDF로 저장</button>
</div>

<div id="drop">여기로 PDF 파일을 끌어다 놓거나 위의 PDF 불러오기 버튼을 누르세요</div>
<div id="grid"></div>
<div class="status" id="hint"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// 불러온 원본 PDF들의 바이트를 보관 (저장 시 pdf-lib가 다시 읽음)
const sources = [];            // { name, bytes }
let pages = [];                // { srcIndex, pageIndex, rotation }
let seq = 0;

const grid = document.getElementById("grid");
const drop = document.getElementById("drop");
const fileInput = document.getElementById("fileInput");

document.getElementById("addBtn").onclick = () => fileInput.click();
fileInput.onchange = (e) => handleFiles(e.target.files);

document.getElementById("clearBtn").onclick = () => {
  sources.length = 0; pages = []; render();
};

["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => handleFiles(e.dataTransfer.files));

async function handleFiles(fileList) {
  const files = [...fileList].filter(f => f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf"));
  if (!files.length) return;
  setHint("불러오는 중...");
  for (const file of files) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const srcIndex = sources.length;
    sources.push({ name: file.name, bytes });
    const doc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
    for (let p = 1; p <= doc.numPages; p++) {
      pages.push({ id: ++seq, srcIndex, pageIndex: p, rotation: 0, _doc: doc });
    }
  }
  render();
  setHint("");
}

function setHint(msg) { document.getElementById("hint").textContent = msg; }

async function render() {
  const has = pages.length > 0;
  drop.style.display = has ? "none" : "block";
  document.getElementById("pageCount").textContent = pages.length;
  document.getElementById("saveBtn").disabled = !has;
  document.getElementById("clearBtn").disabled = !has;
  grid.innerHTML = "";

  pages.forEach((pg, idx) => {
    const card = document.createElement("div");
    card.className = "page";
    card.innerHTML = `
      <div class="thumb"></div>
      <div class="meta">${idx + 1} / ${pages.length} · 회전 ${pg.rotation}°</div>
      <div class="actions">
        <button class="iconbtn" title="앞으로" data-act="left">◀</button>
        <button class="iconbtn" title="왼쪽 회전" data-act="rotL">↺</button>
        <button class="iconbtn" title="오른쪽 회전" data-act="rotR">↻</button>
        <button class="iconbtn del" title="삭제" data-act="del">✕</button>
        <button class="iconbtn" title="뒤로" data-act="right">▶</button>
      </div>`;
    card.querySelectorAll("[data-act]").forEach(b => {
      b.onclick = () => doAction(idx, b.dataset.act);
    });
    grid.appendChild(card);
    drawThumb(pg, card.querySelector(".thumb"));
  });
}

async function drawThumb(pg, container) {
  try {
    const page = await pg._doc.getPage(pg.pageIndex);
    const baseVp = page.getViewport({ scale: 1 });
    const scale = 150 / baseVp.width;
    const vp = page.getViewport({ scale, rotation: pg.rotation });
    const canvas = document.createElement("canvas");
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    container.innerHTML = ""; container.appendChild(canvas);
  } catch (err) {
    container.textContent = "미리보기 실패";
  }
}

function doAction(idx, act) {
  const pg = pages[idx];
  if (act === "del") pages.splice(idx, 1);
  else if (act === "rotL") pg.rotation = (pg.rotation + 270) % 360;
  else if (act === "rotR") pg.rotation = (pg.rotation + 90) % 360;
  else if (act === "left" && idx > 0) [pages[idx-1], pages[idx]] = [pages[idx], pages[idx-1]];
  else if (act === "right" && idx < pages.length - 1) [pages[idx+1], pages[idx]] = [pages[idx], pages[idx+1]];
  render();
}

document.getElementById("saveBtn").onclick = async () => {
  if (!pages.length) return;
  setHint("PDF를 만드는 중...");
  const { PDFDocument, degrees } = PDFLib;
  const loaded = {};
  for (const pg of pages) {
    if (!loaded[pg.srcIndex]) {
      loaded[pg.srcIndex] = await PDFDocument.load(sources[pg.srcIndex].bytes);
    }
  }
  const out = await PDFDocument.create();
  for (const pg of pages) {
    const [copied] = await out.copyPages(loaded[pg.srcIndex], [pg.pageIndex - 1]);
    if (pg.rotation) {
      const base = copied.getRotation().angle || 0;
      copied.setRotation(degrees((base + pg.rotation) % 360));
    }
    out.addPage(copied);
  }
  const bytes = await out.save();
  const blob = new Blob([bytes], { type: "application/pdf" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "edited.pdf";
  a.click();
  URL.revokeObjectURL(a.href);
  setHint("저장 완료. edited.pdf 파일을 확인하세요.");
};
</script>
</body>
</html>
